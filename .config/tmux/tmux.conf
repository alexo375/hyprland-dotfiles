# ==============================================================================
#                 INTUITIVE MODERN TMUX CONFIGURATION
# ==============================================================================

# --- GENERAL & PREFIX ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config with Prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message " Config reloaded!"

# --- TERMINAL & COLORS ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -sg escape-time 10
set -g focus-events on
set -g mouse on
set -g history-limit 10000

# --- INDEXING ---
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# --- DIRECT ALT KEYBINDS (NO PREFIX NEEDED!) ---

# 1. Splitting Panes (Alt + v / Alt + s)
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-s split-window -v -c "#{pane_current_path}"

# 2. Windows Management (Alt + n = new, Alt + 1..9 = switch)
bind -n M-n new-window -c "#{pane_current_path}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# 3. Pane Navigation (Alt + h/j/k/l or Alt + Arrows)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# 4. Direct Resizing (Alt + Ctrl + h/j/k/l or Alt + Ctrl + Arrows)
bind -n -r M-C-h resize-pane -L 5
bind -n -r M-C-j resize-pane -D 5
bind -n -r M-C-k resize-pane -U 5
bind -n -r M-C-l resize-pane -R 5
bind -n -r M-C-Left resize-pane -L 5
bind -n -r M-C-Right resize-pane -R 5
bind -n -r M-C-Up resize-pane -U 5
bind -n -r M-C-Down resize-pane -D 5

# 5. Pane Actions (Alt + f = fullscreen, Alt + x = close pane)
bind -n M-f resize-pane -Z
bind -n M-z resize-pane -Z
bind -n M-x kill-pane
bind -n M-q kill-pane

# --- BACKUP PREFIX KEYBINDS (Ctrl+A + key) ---
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind n new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

bind f resize-pane -Z
bind z resize-pane -Z
bind x kill-pane

# --- COPY MODE & CLIPBOARD ---
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# --- AESTHETICS & STATUS BAR (Inherits Kitty / Matugen background & transparency) ---
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=default,bg=default"

set -g status-left-length 30
set -g status-left "#[fg=black,bg=blue,bold] #S #[fg=blue,bg=default] "

set -g status-right-length 50
set -g status-right "#[fg=brightblack] %Y-%m-%d %H:%M #[fg=black,bg=magenta,bold] #H "

set -g window-status-format "#[fg=brightblack,bg=default] #I: #W "
set -g window-status-current-format "#[fg=cyan,bg=default,bold] #I: #W "

set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"

# Source Matugen generated dynamic theme if available
if-shell '[ -f ~/.config/tmux/colors.conf ]' 'source-file ~/.config/tmux/colors.conf'
