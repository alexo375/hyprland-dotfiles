[config.wallpaper]
command = "awww"
arguments = ["img", "--transition-type", "wipe", "--transition-fps", "240", "--transition-step", "255", "--transition-duration", "1", "--transition-angle", "225" ]
set = true

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/colors/colors.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.swaync]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/colors/colors.css'
post_hook = 'swaync-client -R; swaync-client -rs'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprcolors.lua'
output_path = '~/.config/colors/hyprcolors.lua'
post_hook = 'hyprctl reload || true'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprcolors.conf'
output_path = '~/.config/colors/hyprcolors.conf'


[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/themes/Matugen.conf'
post_hook = "kitty +kitten themes --reload-in=all Matugen & fish -c 'kitty-theme'"

[templates.rofi]
input_path = '~/.config/matugen/templates/colors.rasi'
output_path = '~/.config/colors/colors.rasi'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-3.0/colors.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.cava]
input_path = '~/.config/matugen/templates/cava-colors.ini'
output_path = '~/.config/cava/themes/matugen'
post_hook = "pkill -USR1 cava"

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'

[templates.qt5ct]
input_path = '~/.config/matugen/templates/qtct.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qtct.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.pywalfox]
input_path = '~/.config/matugen/templates/pywalfox-colors.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update'

[templates.neo]
input_path = '~/.config/matugen/templates/neo.json'
output_path = '~/.cache/neo/matugen.json'
post_hook = '~/.config/matugen/scripts/neo-colorfile.sh'

[templates.quickshell_overview]
input_path = '~/.config/matugen/templates/quickshell-overview.qml'
output_path = '~/.config/quickshell/overview/common/Appearance.colors.qml'

[templates.tmux]
input_path = '~/.config/matugen/templates/tmux.conf'
output_path = '~/.config/tmux/colors.conf'
post_hook = 'tmux source-file ~/.config/tmux/tmux.conf 2>/dev/null || true'

