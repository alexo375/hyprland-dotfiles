# Matugen dynamic theme for Tmux
set -g status-position bottom
set -g status-justify left
set -g status-style "fg={{colors.on_surface.default.hex}},bg=default"

set -g status-left-length 30
set -g status-left "#[fg={{colors.on_primary.default.hex}},bg={{colors.primary.default.hex}},bold] #S #[fg={{colors.primary.default.hex}},bg=default]"

set -g status-right-length 50
set -g status-right "#[fg={{colors.on_surface_variant.default.hex}}] %Y-%m-%d %H:%M #[fg={{colors.on_secondary.default.hex}},bg={{colors.secondary.default.hex}},bold] #H "

set -g window-status-format "#[fg={{colors.on_surface_variant.default.hex}},bg=default] #I: #W "
set -g window-status-current-format "#[fg={{colors.on_tertiary_container.default.hex}},bg={{colors.tertiary_container.default.hex}},bold] #I: #W #[fg={{colors.tertiary_container.default.hex}},bg=default]"

set -g pane-border-style "fg={{colors.outline_variant.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"
