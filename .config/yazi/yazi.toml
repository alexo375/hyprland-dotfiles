# Keep large previews usable without disabling Yazi's safety limits entirely.
[preview]
max_width  = 10000
max_height = 10000

[tasks]
image_alloc = 536870912
image_bound = [12000, 12000]

[plugin]
# Use exiftool/mediainfo for richer Tab metadata on common media files.
prepend_spotters = [
  { mime = "image/*", run = "rich-metadata" },
  { mime = "{audio,video}/*", run = "rich-metadata" },
  { mime = "text/*", run = "rich-metadata" },
  { mime = "application/*", run = "rich-metadata" },
  { mime = "inode/empty", run = "rich-metadata" },
]

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
