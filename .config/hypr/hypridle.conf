#  on-resume = notify-send "Activity detected" "Screen off is prevented or lifted!"
# }

listener {
 timeout = 3600
 on-timeout = ~/.config/hypr/scripts/power_suspend.sh
 on-resume = hyprctl dispatch dpms on
}
