general {
 lock_cmd = pgrep -xu "$USER" hyprlock >/dev/null || hyprlock
 before_sleep_cmd = loginctl lock-session
 after_sleep_cmd = ~/.config/hypr/scripts/lock_resume.sh --resume
}

listener {
 timeout = 300
 on-timeout = ~/.config/hypr/scripts/brightness_idle.sh dim
 on-resume = ~/.config/hypr/scripts/brightness_idle.sh restore
}

listener {
 timeout = 900
 on-timeout = hyprctl dispatch dpms off
 on-resume = hyprctl dispatch dpms on
}

